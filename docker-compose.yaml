# =====================================================================
#  lab-free5gc — nucleo 5G emulado + observabilidad
# =====================================================================
#
#  ARRANQUE Y RECUPERACION
#
#  Todos los servicios llevan restart: "no". El arranque y la recuperacion
#  los hace UN solo dueno: deploy/lab5g-stack.sh (servicio systemd
#  lab5g-stack), de uno en uno y con compuertas de carga. Con
#  'unless-stopped', Docker levantaba ~25 contenedores a la vez al arrancar
#  el demonio: el host (4 nucleos, 3.8 GB, disco mecanico) llego a load
#  average 28 con I/O al 99 % en el arranque en frio del 21 nov (en la
#  estampida original llego a 105) y dejo de atender hasta SSH. No convergia.
#
#  PERFILES
#
#    perfil        servicios                                             siempre
#    (sin perfil)  NUCLEO: mongodb nrf udr udm ausf pcf nssf amf smf upf   si
#    ran           gnb, ue, dn-iperf (destino del trafico del UE)          si
#    compresion    cmp-dn, cmp-ue, envio, envio-eco, cmp-gen               si
#                  (REQUIERE 'ran': cmp-ue/cmp-gen viven en el netns del UE;
#                  pagina de envio: http://<host>:8088, solo LAN/tailnet)
#    obs           SOLO prometheus + pushgateway                           si
#    grafana       grafana, bajo demanda (docker compose --profile grafana up -d)  no
#    obs-extra     phy-sim (metricas teoricas de capa fisica)              no
#    probes        blackbox, iperf-probe (REQUIEREN 'ran': netns del UE)   no
#
#  Retirados: dozzle, webui, cadvisor, node-exporter (su RAM/CPU no se
#  justifica; lab5g-stack publica los datos de host al pushgateway;
#  ci/provision-subscriber.sh aprovisiona con mongosh, sin la webui).
#
#  Uso manual:
#    sudo /usr/local/sbin/lab5g.sh start nucleo|ran|compresion|obs
#
#  Limites: cada servicio tiene mem_limit/mem_reservation/cpus/pids_limit
#  (mem_limit medido en reposo el 21 nov; los no medidos siguen
#  'provisional'). Los calculos estan al final del archivo.
#
#  Ojo: 'docker compose exec|logs|ps' no ve los servicios de un perfil
#  inactivo. Para operar sobre 'ue' o 'gnb':  export COMPOSE_PROFILES=ran
# =====================================================================

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "2" }

x-f5gc-common: &f5gc-common
  restart: "no"          # lo arranca/recupera deploy/lab5g-stack.sh
  environment:
    GIN_MODE: release
  logging: *logging

networks:
  sbi_net:
    name: sbi_net
    ipam: { config: [ { subnet: 10.100.200.0/24 } ] }
    driver_opts: { com.docker.network.driver.mtu: "${DOCKER_MTU:-1500}" }
  n3_net:
    name: n3_net
    ipam: { config: [ { subnet: 10.100.201.0/24 } ] }
    driver_opts: { com.docker.network.driver.mtu: "${DOCKER_MTU:-1500}" }
  radio_net:
    name: radio_net
    ipam: { config: [ { subnet: 10.100.203.0/24 } ] }
    driver_opts: { com.docker.network.driver.mtu: "${DOCKER_MTU:-1500}" }
  dn_net:
    name: dn_net
    ipam: { config: [ { subnet: 10.100.204.0/24 } ] }
    driver_opts: { com.docker.network.driver.mtu: "${DOCKER_MTU:-1500}" }
  obs_net:
    name: obs_net
    ipam: { config: [ { subnet: 10.100.205.0/24 } ] }

volumes:
  mongo-data:
  prom-data:
  grafana-data:
  pushgw-data:        # persistencia del pushgateway: sobrevive a recrear el contenedor y a reinicios

services:

  # ------------------------------------------------------------------
  #  Datos
  # ------------------------------------------------------------------
  mongodb:
    image: mongo:${MONGO_TAG:-6.0}
    container_name: mongodb
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 384m
    mem_reservation: 230m
    cpus: 1.0
    pids_limit: 300
    oom_score_adj: -300
    logging: *logging
    stop_grace_period: 20s
    restart: "no"
    command: mongod --port 27017 --wiredTigerCacheSizeGB 0.25   # 0.25 es el MINIMO que acepta mongod (con 0.125 sale con error 1); mem_limit 384m = cache 256 MB + overhead (medido: 110 MB en reposo)
    volumes: [ mongo-data:/data/db ]
    networks:
      sbi_net: { ipv4_address: 10.100.200.40 }
    healthcheck:
      test: ["CMD","mongosh","--quiet","--eval","db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      # start_period es la correccion clave: sin el, el healthcheck empieza a
      # contar fallos desde el segundo cero. Aqui mongod tarda ~90 s solo en
      # arrancar, asi que los 120 s de presupuesto (12 x 10 s) se agotaban
      # antes de que respondiera, compose abortaba el 'up' y dejaba los NF
      # que dependen de el en estado 'created'.
      start_period: 180s
      retries: 20

  # ------------------------------------------------------------------
  #  Plano de control
  # ------------------------------------------------------------------
  nrf:
    <<: *f5gc-common
    image: free5gc/nrf:${FREE5GC_TAG:-v3.4.4}
    container_name: nrf
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 48m
    mem_reservation: 28m
    cpus: 0.5
    pids_limit: 100
    logging: *logging
    stop_grace_period: 20s
    command: ./nrf -c ./config/nrfcfg.yaml
    environment:
      DB_URI: mongodb://mongodb:27017/free5gc
      GIN_MODE: release
    volumes: [ ./config/nrfcfg.yaml:/free5gc/config/nrfcfg.yaml:ro ]
    networks:
      sbi_net: { ipv4_address: 10.100.200.10 }
    depends_on:
      mongodb: { condition: service_healthy }

  udr:
    <<: *f5gc-common
    image: free5gc/udr:${FREE5GC_TAG:-v3.4.4}
    container_name: udr
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 48m
    mem_reservation: 28m
    cpus: 0.5
    pids_limit: 100
    logging: *logging
    stop_grace_period: 20s
    command: ./udr -c ./config/udrcfg.yaml
    environment:
      DB_URI: mongodb://mongodb:27017/free5gc
      GIN_MODE: release
    volumes: [ ./config/udrcfg.yaml:/free5gc/config/udrcfg.yaml:ro ]
    networks: { sbi_net: { ipv4_address: 10.100.200.15 } }
    depends_on: [ nrf ]

  udm:
    <<: *f5gc-common
    image: free5gc/udm:${FREE5GC_TAG:-v3.4.4}
    container_name: udm
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 48m
    mem_reservation: 28m
    cpus: 0.5
    pids_limit: 100
    logging: *logging
    stop_grace_period: 20s
    command: ./udm -c ./config/udmcfg.yaml
    volumes: [ ./config/udmcfg.yaml:/free5gc/config/udmcfg.yaml:ro ]
    networks: { sbi_net: { ipv4_address: 10.100.200.14 } }
    depends_on: [ nrf, udr ]

  ausf:
    <<: *f5gc-common
    image: free5gc/ausf:${FREE5GC_TAG:-v3.4.4}
    container_name: ausf
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 48m
    mem_reservation: 28m
    cpus: 0.5
    pids_limit: 100
    logging: *logging
    stop_grace_period: 20s
    command: ./ausf -c ./config/ausfcfg.yaml
    volumes: [ ./config/ausfcfg.yaml:/free5gc/config/ausfcfg.yaml:ro ]
    networks: { sbi_net: { ipv4_address: 10.100.200.13 } }
    depends_on: [ nrf ]

  pcf:
    <<: *f5gc-common
    image: free5gc/pcf:${FREE5GC_TAG:-v3.4.4}
    container_name: pcf
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 64m
    mem_reservation: 38m
    cpus: 0.5
    pids_limit: 100
    logging: *logging
    stop_grace_period: 20s
    command: ./pcf -c ./config/pcfcfg.yaml
    volumes: [ ./config/pcfcfg.yaml:/free5gc/config/pcfcfg.yaml:ro ]
    networks: { sbi_net: { ipv4_address: 10.100.200.16 } }
    depends_on: [ nrf ]

  nssf:
    <<: *f5gc-common
    image: free5gc/nssf:${FREE5GC_TAG:-v3.4.4}
    container_name: nssf
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 48m
    mem_reservation: 28m
    cpus: 0.5
    pids_limit: 100
    logging: *logging
    stop_grace_period: 20s
    command: ./nssf -c ./config/nssfcfg.yaml
    volumes: [ ./config/nssfcfg.yaml:/free5gc/config/nssfcfg.yaml:ro ]
    networks: { sbi_net: { ipv4_address: 10.100.200.17 } }
    depends_on: [ nrf ]

  amf:
    <<: *f5gc-common
    image: free5gc/amf:${FREE5GC_TAG:-v3.4.4}
    container_name: amf
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 96m
    mem_reservation: 57m
    cpus: 1.0
    pids_limit: 150
    oom_score_adj: -300
    logging: *logging
    stop_grace_period: 20s
    command: ./amf -c ./config/amfcfg.yaml
    volumes: [ ./config/amfcfg.yaml:/free5gc/config/amfcfg.yaml:ro ]
    networks: { sbi_net: { ipv4_address: 10.100.200.11 } }
    depends_on: [ nrf, ausf, udm, pcf, nssf ]

  smf:
    <<: *f5gc-common
    image: free5gc/smf:${FREE5GC_TAG:-v3.4.4}
    container_name: smf
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 96m
    mem_reservation: 57m
    cpus: 1.0
    pids_limit: 150
    oom_score_adj: -300
    logging: *logging
    stop_grace_period: 20s
    command: ./smf -c ./config/smfcfg.yaml -u ./config/uerouting.yaml
    volumes:
      - ./config/smfcfg.yaml:/free5gc/config/smfcfg.yaml:ro
      - ./config/uerouting.yaml:/free5gc/config/uerouting.yaml:ro
    networks: { sbi_net: { ipv4_address: 10.100.200.12 } }
    depends_on: [ nrf, amf, upf ]

  # ------------------------------------------------------------------
  #  Plano de usuario  (requiere gtp5g cargado en el host Proxmox)
  # ------------------------------------------------------------------
  upf:
    image: free5gc/upf:${FREE5GC_TAG:-v3.4.4}
    container_name: upf
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 128m
    mem_reservation: 76m
    cpus: 1.5
    pids_limit: 200
    oom_score_adj: -300
    logging: *logging
    stop_grace_period: 20s
    restart: "no"
    command: bash -c "/free5gc/upf-nat.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ./config/upfcfg.yaml:/free5gc/config/upfcfg.yaml:ro
      - ./config/upf-nat.sh:/free5gc/upf-nat.sh:ro
    cap_add: [ NET_ADMIN, SYS_MODULE ]
    privileged: true
    devices: [ "/dev/net/tun:/dev/net/tun" ]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "2"
    networks:
      sbi_net: { ipv4_address: 10.100.200.20 }   # N4 (PFCP)
      n3_net:  { ipv4_address: 10.100.201.20 }   # N3 (GTP-U)
      dn_net:  { ipv4_address: 10.100.204.20 }   # Data Network

  # ------------------------------------------------------------------
  #  RAN emulada
  # ------------------------------------------------------------------
  gnb:
    image: free5gc/ueransim:${UERANSIM_TAG:-latest}
    container_name: gnb
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 48m
    mem_reservation: 28m
    cpus: 1.0
    pids_limit: 100
    logging: *logging
    init: true             # PID 1 que reenvia SIGTERM (si no, cada stop tarda 30 s)
    stop_grace_period: 10s
    profiles: [ ran ]
    restart: "no"
    command: ./nr-gnb -c ./config/gnb.yaml
    volumes: [ ./ueransim/gnb.yaml:/ueransim/config/gnb.yaml:ro ]
    cap_add: [ NET_ADMIN ]
    devices: [ "/dev/net/tun:/dev/net/tun" ]
    networks:
      sbi_net:   { ipv4_address: 10.100.200.30 }   # N2 (NGAP/SCTP)
      n3_net:    { ipv4_address: 10.100.201.30 }   # N3 (GTP-U)
      radio_net: { ipv4_address: 10.100.203.30 }   # radio emulada
    depends_on: [ amf, upf ]

  ue:
    image: free5gc/ueransim:${UERANSIM_TAG:-latest}
    container_name: ue
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 64m
    mem_reservation: 38m
    cpus: 1.0
    pids_limit: 100
    logging: *logging
    init: true             # PID 1 que reenvia SIGTERM (si no, cada stop tarda 30 s)
    stop_grace_period: 10s
    profiles: [ ran ]
    restart: "no"
    entrypoint: [ "/bin/bash", "/ueransim/ue-entrypoint.sh" ]
    environment:
      UE_MTU: "${UE_MTU:-1464}"
      DN_SUBNET: "${DN_SUBNET:-10.100.204.0/24}"
    volumes:
      - ./ueransim/ue.yaml:/ueransim/config/ue.yaml:ro
      - ./ueransim/ue-entrypoint.sh:/ueransim/ue-entrypoint.sh:ro
    cap_add: [ NET_ADMIN ]
    devices: [ "/dev/net/tun:/dev/net/tun" ]
    sysctls:
      net.ipv4.conf.all.rp_filter: "2"
    networks:
      radio_net: { ipv4_address: 10.100.203.31 }
      obs_net:   { ipv4_address: 10.100.205.31 }   # solo para exponer sondas
      # 'blackbox' vive en este netns (network_mode: service:ue) y necesita
      # alcanzar sbi_net para el job 'blackbox-sbi-tcp' (Prometheus). Sin
      # esto, el probe TCP a NRF/AMF/SMF/Mongo siempre da timeout y el panel
      # "Alcanzabilidad de los NF (TCP)" queda en CAIDO aunque el core este
      # sano: no hay bug en los NF, es que el probe no tenia ruta.  El UE de
      # verdad (UERANSIM) nunca usa esta interfaz, solo su tunel PDU/NAS.
      sbi_net:   { ipv4_address: 10.100.200.31 }   # solo para que blackbox alcance el SBI
    depends_on: [ gnb, smf ]

  # ------------------------------------------------------------------
  #  Data Network — destino del trafico del UE
  # ------------------------------------------------------------------
  dn-iperf:
    image: networkstatic/iperf3   # ⚠️ verifica el tag antes de usar
    container_name: dn-iperf
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 32m
    mem_reservation: 19m
    cpus: 0.5
    pids_limit: 50
    logging: *logging
    init: true             # PID 1 que reenvia SIGTERM (si no, cada stop tarda 30 s)
    stop_grace_period: 10s
    profiles: [ ran ]
    restart: "no"
    command: -s
    networks: { dn_net: { ipv4_address: 10.100.204.10 } }

  # ==================================================================
  #  COMPRESION DE PAQUETES  (perfil 'compresion', REQUIERE 'ran')
  # ==================================================================
  #  Un tunel que comprime cada paquete IP entre el UE y la DN: ROHC-lite
  #  para las cabeceras + el codec de carga que elige un bandido UCB.
  #  Ver compresion/ y docs/08-compresion-paquetes.md.  Dos contenedores
  #  python:alpine sin dependencias (~15 MB de RAM cada uno).
  #    sudo /usr/local/sbin/lab5g.sh start compresion
  #    bash compresion/medir.sh
  cmp-dn:
    image: python:3.14-alpine         # 3.14: zstd en la biblioteca estandar
    container_name: cmp-dn
    # provisional: sin medir aun; ajustar con docker stats
    mem_limit: 64m
    mem_reservation: 38m
    cpus: 1.0
    pids_limit: 64
    logging: *logging
    init: true             # PID 1 que reenvia SIGTERM (si no, cada stop tarda 30 s)
    stop_grace_period: 10s
    profiles: [ compresion ]
    restart: "no"
    entrypoint: [ "python3", "-u", "/cmp/shim.py", "dn" ]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PUSHGATEWAY: http://10.100.205.14:9091
      VELOCIDAD_ENLACE_BPS: ${VELOCIDAD_ENLACE_BPS:-}   # vacio = bandido premiado por ahorro
      PERDIDA_IOT: ${PERDIDA_IOT:-}                     # vacio = sin perdida; 1 = pasos por defecto (docs/08 4.8)
    volumes: [ ./compresion:/cmp:ro ]
    cap_add: [ NET_ADMIN ]
    devices: [ "/dev/net/tun:/dev/net/tun" ]
    networks:
      dn_net:  { ipv4_address: 10.100.204.30 }
      obs_net: { ipv4_address: 10.100.205.32 }   # solo para el pushgateway
    # La pagina de envio (servicio envio) vive en este netns: su puerto se publica aqui.
    # Sin login: solo LAN y tailnet. NO agregarlo a 'tailscale funnel'.
    ports: [ "8088:8088" ]

  cmp-ue:
    image: python:3.14-alpine         # misma version en los dos extremos (mismos codecs)
    container_name: cmp-ue
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 64m
    mem_reservation: 38m
    cpus: 1.0
    pids_limit: 64
    logging: *logging
    init: true             # PID 1 que reenvia SIGTERM (si no, cada stop tarda 30 s)
    stop_grace_period: 10s
    profiles: [ compresion ]
    restart: "no"
    entrypoint: [ "python3", "-u", "/cmp/shim.py", "ue" ]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PAR: 10.100.204.30
      PUSHGATEWAY: http://10.100.205.14:9091
      VELOCIDAD_ENLACE_BPS: ${VELOCIDAD_ENLACE_BPS:-}   # p. ej. 1000000 con tc a 1 Mbps
      PERDIDA_IOT: ${PERDIDA_IOT:-}                     # vacio = sin perdida; 1 = pasos por defecto (docs/08 4.8)
    volumes: [ ./compresion:/cmp:ro ]
    cap_add: [ NET_ADMIN ]
    devices: [ "/dev/net/tun:/dev/net/tun" ]
    network_mode: "service:ue"      # <-- en el netns del UE, como blackbox
    depends_on: [ ue, cmp-dn ]

  # Pagina para mandar un archivo real por la red 5G, ida y vuelta, a traves del compresor
  # (compresion/envio.py, docs/08 seccion 4.9). La pagina vive del lado DN; el eco, en el UE.
  envio:
    image: python:3.14-alpine
    container_name: envio
    # provisional: sin medir aun; ajustar con docker stats
    mem_limit: 96m
    mem_reservation: 57m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
    init: true             # PID 1 que reenvia SIGTERM (si no, cada stop tarda 30 s)
    stop_grace_period: 10s
    profiles: [ compresion ]
    restart: "no"
    entrypoint: [ "python3", "-u", "/cmp/envio.py", "pagina" ]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: [ ./compresion:/cmp:ro ]
    network_mode: "service:cmp-dn"  # ve el cmp0 10.99.0.2 y los contadores de cmp-dn
    depends_on: [ cmp-dn ]

  envio-eco:
    image: python:3.14-alpine
    container_name: envio-eco
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 96m
    mem_reservation: 57m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
    init: true             # PID 1 que reenvia SIGTERM (si no, cada stop tarda 30 s)
    stop_grace_period: 10s
    profiles: [ compresion ]
    restart: "no"
    entrypoint: [ "python3", "-u", "/cmp/envio.py", "eco" ]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: [ ./compresion:/cmp:ro ]
    network_mode: "service:ue"      # junto a cmp-ue: escucha en 10.99.0.1
    depends_on: [ cmp-ue ]

  # Generador de trafico variable (compresion/generar.py): con --continuo repite las clases
  # sin parar; --aleatorio hace que cada clase mande entre 1 y --paquetes paquetes por vuelta
  # (--paquetes es un TOPE, no un total) y --tasa 9-27 cambia el ritmo cada --cambio-s.
  # Va por cmp0 (10.99.0.2 = lado DN), asi alimenta los paneles de compresion sin intervencion.
  cmp-gen:
    image: python:3.14-alpine
    container_name: cmp-gen
    # provisional: sin medir aun; ajustar con docker stats
    mem_limit: 48m
    mem_reservation: 28m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
    init: true             # PID 1 que reenvia SIGTERM (si no, cada stop tarda 30 s)
    stop_grace_period: 10s
    profiles: [ compresion ]
    restart: "no"
    entrypoint: [ "python3", "-u", "/cmp/generar.py", "--destino", "10.99.0.2", "--paquetes", "25", "--aleatorio", "--tasa", "9-27", "--cambio-s", "120", "--continuo" ]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: [ ./compresion:/cmp:ro ]
    network_mode: "service:ue"      # junto a cmp-ue: sale por cmp0
    depends_on: [ cmp-ue ]

  # ==================================================================
  #  OBSERVABILIDAD
  # ==================================================================

  prometheus:
    image: prom/prometheus:latest      # TODO fijar tag/digest con la salida de docker image ls del servidor
    pull_policy: missing
    container_name: prometheus
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 256m
    mem_reservation: 153m
    cpus: 1.0
    pids_limit: 100
    oom_score_adj: 0
    logging: *logging
    stop_grace_period: 20s
    profiles: [ obs ]
    restart: "no"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB   # el LXC tiene ~7 GB libres: el backup exige 2x el TSDB + 2 GB
      - --storage.tsdb.wal-compression
      - --web.enable-lifecycle
      # Necesario para el snapshot de copia de seguridad (POST /api/v1/admin/tsdb/snapshot).
      # OJO: tambien expone endpoints de BORRADO (delete_series, clean_tombstones); por eso
      # el puerto 9090 es solo LAN y nunca debe publicarse en internet/funnel.
      - --web.enable-admin-api
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    networks: { obs_net: { ipv4_address: 10.100.205.10 } }
    ports: [ "9090:9090" ]

  grafana:
    image: grafana/grafana:latest      # TODO fijar tag/digest con la salida de docker image ls del servidor
    pull_policy: missing
    container_name: grafana
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 768m
    mem_reservation: 460m
    cpus: 1.0
    pids_limit: 100
    oom_score_adj: 800
    logging: *logging
    stop_grace_period: 20s
    profiles: [ grafana ]       # bajo demanda: docker compose --profile grafana up -d grafana
    restart: "no"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD en /etc/lab5g/lab5g.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: { obs_net: { ipv4_address: 10.100.205.11 } }
    ports: [ "3000:3000" ]
    # Sin depends_on de prometheus: vive en otro perfil (obs) y compose rechazaria
    # arrancar 'grafana' solo. Grafana tolera que el datasource este caido un rato.

  # Latencia medida DESDE el UE, a traves de uesimtun0
  blackbox:
    image: prom/blackbox-exporter:latest      # TODO fijar tag/digest con la salida de docker image ls del servidor
    pull_policy: missing
    container_name: blackbox
    # provisional: sin medir aun; ajustar con docker stats
    mem_limit: 48m
    mem_reservation: 28m
    cpus: 0.5
    pids_limit: 50
    oom_score_adj: 800
    logging: *logging
    init: true             # PID 1 que reenvia SIGTERM (si no, cada stop tarda 30 s)
    stop_grace_period: 10s
    profiles: [ probes ]
    restart: "no"
    command: --config.file=/config/blackbox.yml
    volumes: [ ./observability/blackbox/blackbox.yml:/config/blackbox.yml:ro ]
    cap_add: [ NET_RAW ]
    network_mode: "service:ue"      # <-- vive en el netns del UE
    depends_on: [ ue ]

  pushgateway:
    image: prom/pushgateway:latest      # TODO fijar tag/digest con la salida de docker image ls del servidor
    pull_policy: missing
    container_name: pushgateway
    # medido en reposo el 21 nov; revisar con memory.peak bajo carga
    mem_limit: 48m
    mem_reservation: 28m
    cpus: 0.5
    pids_limit: 50
    oom_score_adj: 0
    logging: *logging
    stop_grace_period: 20s
    profiles: [ obs ]
    restart: "no"
    # Persistencia: sin esto, un reinicio borra TODAS las metricas empujadas (compresion,
    # sondas) hasta el siguiente push. La imagen corre como 'nobody' y un volumen nombrado
    # nuevo nace como root, asi que no podria escribir /data: se corre como root (el
    # contenedor solo escucha en obs_net, sin puertos publicados).
    user: "0:0"
    command: [ "--persistence.file=/data/pushgateway.db", "--persistence.interval=1m" ]
    volumes: [ "pushgw-data:/data" ]
    networks: { obs_net: { ipv4_address: 10.100.205.14 } }

  # Metricas de capa fisica y teoria de la informacion, adaptadas del notebook
  # D:\Proyectos\UD.Lab2.TeoriaInformacion\Actividad_2.ipynb: agente Q-Learning
  # que elige potencia de Tx por slice (eMBB/URLLC/mMTC) y simula el resto de
  # la cadena PHY (FSPL, SNR/SIR/SINR, Shannon-Hartley, entropia de la fuente).
  # free5GC/UERANSIM no tienen RF real, asi que esto no mide la red del lab:
  # es la capa teorica de la materia, empujada al mismo pushgateway.
  phy-sim:
    image: python:3.12-alpine
    pull_policy: missing
    container_name: phy-sim
    # provisional: sin medir aun; ajustar con docker stats
    mem_limit: 48m
    mem_reservation: 28m
    cpus: 0.5
    pids_limit: 50
    oom_score_adj: 800
    logging: *logging
    init: true             # PID 1 que reenvia SIGTERM (si no, cada stop tarda 30 s)
    stop_grace_period: 10s
    profiles: [ obs-extra ]
    restart: "no"
    entrypoint: [ "python3", "/probe/phy_sim_exporter.py" ]
    volumes: [ ./observability/probe/phy_sim_exporter.py:/probe/phy_sim_exporter.py:ro ]
    environment:
      PUSHGATEWAY: http://10.100.205.14:9091
      INTERVAL: "15"
      ESCENARIO: nominal
    networks: { obs_net: { ipv4_address: 10.100.205.16 } }

  # Throughput periodico a traves del tunel
  iperf-probe:
    image: alpine:3.20
    pull_policy: missing
    container_name: iperf-probe
    # provisional: sin medir aun; ajustar con docker stats
    mem_limit: 32m
    mem_reservation: 19m
    cpus: 0.5
    pids_limit: 50
    oom_score_adj: 800
    logging: *logging
    init: true             # PID 1 que reenvia SIGTERM (si no, cada stop tarda 30 s)
    stop_grace_period: 10s
    profiles: [ probes ]
    restart: "no"
    entrypoint: [ "/bin/sh", "/probe/iperf-probe.sh" ]
    volumes: [ ./observability/probe/iperf-probe.sh:/probe/iperf-probe.sh:ro ]
    environment:
      IPERF_TARGET: 10.100.204.10
      PUSHGATEWAY: http://10.100.205.14:9091
      INTERVAL: "300"
      DURATION: "10"
    network_mode: "service:ue"      # <-- tambien en el netns del UE
    depends_on: [ ue ]

# =====================================================================
#  Presupuesto de memoria (mem_limit = TOPE, no consumo; MiB)
#  Topes ~2-3x lo medido en reposo el 21 nov (docker stats, poco trafico);
#  UPF/AMF/SMF con mas margen porque crecen bajo trafico. Revisar con
#  memory.peak bajo carga.
#    nucleo     mongodb 384 + nrf 48 + udr 48 + udm 48 + ausf 48 + pcf 64
#               + nssf 48 + amf 96 + smf 96 + upf 128        = 1008
#    ran        gnb 48 + ue 64 + dn-iperf 32                 =  144
#    compresion cmp-dn 64 + cmp-ue 64 + envio 96
#               + envio-eco 96 (archivo de ~20 MB en RAM) + cmp-gen 48 = 368
#    obs        prometheus 256 (WAL, snapshots) + pushgateway 48 = 304
#    TOTAL de topes, siempre encendidos (sin grafana)         = 1824
#  Uso REAL medido de ese conjunto: ~0.3 GB. Con Grafana (medido 524 MB,
#  tope 768) el uso real sube a ~0.85 GB y el tope total a 2592 MB.
#  Los topes solo acotan el peor caso de cada contenedor; NO son una
#  restriccion de suma. Lo que protege el arranque de Grafana (y de todo
#  lo demas) es la compuerta de MemAvailable (GATE_MEM) de lab5g.sh.
#  Bajo demanda: grafana 768, phy-sim 48, blackbox 48, iperf-probe 32.
# =====================================================================
