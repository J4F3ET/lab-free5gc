name: Deploy 5G Simulator to LXC

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Detener infraestructura previa
        run: docker compose down -v
        
      - name: Desplegar entorno 5G y Panel Streamlit
        run: docker compose up -d --build
          
      - name: Esperar a que ambulance-monitor responda (200 OK)
        run: |
          echo "Esperando a que Streamlit instale dependencias y esté listo..."
          sleep 480 # Duerme mientras se instala dependencias y se prepara el servidor
          timeout=240 # Tiempo máximo de espera en segundos (4 minutos)
          elapsed=0
          
          until curl -s -o /dev/null -w "%{http_code}" http://localhost:8501 | grep -q "200"; do
            if [ $elapsed -ge $timeout ]; then
              echo "Error: El servicio tardó demasiado en responder."
              exit 1
            fi
            sleep 5
            elapsed=$((elapsed + 5))
            echo "Intentando conectar... (${elapsed}s)"
          done
          
          echo "¡El servicio ambulance-monitor está activo y respondiendo 200 OK!"
      - name: Esperar a que el servicio responda vía Tailscale (200 OK)
        run: |
          echo "Esperando a que https://red5g.tail5afc32.ts.net esté disponible..."
          timeout=180
          elapsed=0
          
          until curl -s -L -o /dev/null -w "%{http_code}" https://red5g.tail5afc32.ts.net | grep -q "200"; do
            if [ $elapsed -ge $timeout ]; then
              echo "Error: El servicio tardó demasiado en responder a través de Tailscale."
              exit 1
            fi
            sleep 5
            elapsed=$((elapsed + 5))
            echo "Intentando conectar... (${elapsed}s)"
          done
          
          echo "¡El servicio responde correctamente a través de la red de Tailscale!"
      - name: Verificar estado de los servicios
        run: docker compose ps