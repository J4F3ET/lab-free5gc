name: Deploy 5G Simulator to LXC

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Detener infraestructura previa
        run: docker compose down -v

      - name: Desplegar entorno 5G
        run: docker compose up -d --build

      - name: Esperar a que ambulance-monitor responda localmente
        run: |
          echo "Esperando que Streamlit levante en el puerto 8501..."
          timeout=240
          elapsed=0
          until curl -s -o /dev/null -w "%{http_code}" http://localhost:8501 | grep -q "200"; do
            if [ $elapsed -ge $timeout ]; then
              echo "Error: El servicio no levantó a tiempo."
              docker compose logs --tail 100 ambulance-monitor
              exit 1
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "Servicio local activo."

      - name: Verificar disponibilidad vía Tailscale
        run: |
          echo "Verificando endpoint de Tailscale..."
          timeout=180
          elapsed=0
          until curl -s -L -o /dev/null -w "%{http_code}" https://red5g.tail5afc32.ts.net | grep -q "200"; do
            if [ $elapsed -ge $timeout ]; then
              echo "Error: El servicio no es accesible vía Tailscale."
              exit 1
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "Endpoint de Tailscale respondiendo."

      - name: Auditoría de estado de contenedores
        run: |
          docker compose ps
          BAD_STATE=$(docker compose ps --format json | grep -Ei '"State":"(restarting|exited|dead)"' || true)
          if [ -n "$BAD_STATE" ]; then
            echo "Error: Contenedores en estado crítico detectados."
            docker compose logs
            exit 1
          fi