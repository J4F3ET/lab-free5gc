name: deploy-5g-lab

on:
  push:
    branches: [ master ]
    paths:
      - 'config/**'
      - 'ueransim/**'
      - 'observability/**'
      - 'docker-compose.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: 'Saltar el smoke test del UE'
        type: boolean
        default: false
      con_observabilidad:
        description: 'Levantar tambien Prometheus, Grafana, cAdvisor y sondas (6+2 contenedores mas)'
        type: boolean
        default: false

# Nunca dos despliegues simultaneos sobre el mismo LXC
concurrency:
  group: lab5g-deploy
  cancel-in-progress: false

env:
  COMPOSE_PROJECT_NAME: lab5g
  DOCKER_BUILDKIT: '1'
  # Con perfiles, 'docker compose exec/logs/ps' no ve los servicios de un
  # perfil inactivo. El smoke test opera sobre 'ue', 'gnb' y 'dn-iperf', que
  # viven en el perfil 'ran', asi que se declara aqui para todos los jobs.
  # La observabilidad NO va aqui: se activa solo con --profile en su paso.
  COMPOSE_PROFILES: ran

jobs:

  # ------------------------------------------------------------------
  #  1. Validacion estatica — sin tocar el despliegue vivo
  # ------------------------------------------------------------------
  validate:
    runs-on: [ self-hosted, lxc, free5gc ]
    steps:
      - uses: actions/checkout@v4

      - name: Verificar kernel, modulos y devices
        run: bash ci/preflight.sh

      - name: Validar sintaxis de docker-compose
        run: docker compose config --quiet

      - name: Coherencia de PLMN / TAC / S-NSSAI / nodeID
        run: |
          # pyyaml va como paquete del sistema (python3-yaml), instalado por
          # deploy/bootstrap-runner.sh. Antes este paso hacia
          # 'pip install --user pyyaml', que aqui falla siempre: Debian 13
          # marca el entorno como externally-managed (PEP 668) y en este
          # runner pip no esta ni instalado.
          python3 -c 'import yaml' 2>/dev/null || {
            echo "::error::falta python3-yaml en el runner -> ejecuta deploy/bootstrap-runner.sh"
            exit 1
          }
          python3 ci/check-plmn.py

  # ------------------------------------------------------------------
  #  2. Despliegue
  # ------------------------------------------------------------------
  deploy:
    needs: validate
    runs-on: [ self-hosted, lxc, free5gc ]
    steps:
      - uses: actions/checkout@v4

      - name: Generar .env con secretos
        run: |
          cp .env.example .env
          echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> .env

      - name: Reaplicar reglas de red del host
        run: sudo -n /usr/local/sbin/lab5g-netrules.sh

      - name: Descargar imagenes
        run: docker compose pull --quiet

      # El arranque va por etapas y con perfiles, a proposito.
      #
      # Arrancar los 22 servicios de golpe llevo el host (4 nucleos, 3.8 GB)
      # a un load average de 105: los NF entraban en crash-loop, cada
      # reinicio consumia el I/O que los demas necesitaban para arrancar, y
      # el host dejaba de atender hasta SSH. No convergia.
      #
      # Por eso el perfil por defecto es SOLO el nucleo (10 contenedores) y
      # la observabilidad queda detras de un flag explicito.
      - name: Levantar la base de datos y esperar a que este sana
        run: |
          docker compose up -d --remove-orphans --wait --wait-timeout 600 mongodb
          docker compose ps mongodb

      - name: Levantar el plano de control
        run: |
          docker compose up -d nrf udr udm ausf pcf nssf amf upf smf
          docker compose ps

      - name: Esperar a que el plano de control este listo
        run: bash ci/wait-ready.sh

      - name: Aprovisionar suscriptor en MongoDB
        run: bash ci/provision-subscriber.sh

      # Perfil 'ran': gnb, ue y dn-iperf (el destino del trafico del UE).
      - name: Levantar RAN emulada
        run: |
          docker compose --profile ran up -d
          docker compose ps

      # Observabilidad solo si se pide de forma explicita. Son 6 contenedores
      # del perfil 'obs' mas 2 sondas del perfil 'probes', y en un host
      # ajustado la diferencia entre arrancar y no arrancar.
      # 'probes' necesita 'ran': blackbox e iperf-probe viven en el netns
      # del UE (network_mode: service:ue).
      - name: Levantar observabilidad
        if: ${{ inputs.con_observabilidad }}
        run: |
          docker compose --profile obs --profile probes up -d
          docker compose ps

  # ------------------------------------------------------------------
  #  3. Smoke test end-to-end
  # ------------------------------------------------------------------
  smoke:
    needs: deploy
    if: ${{ !inputs.skip_smoke }}
    runs-on: [ self-hosted, lxc, free5gc ]
    steps:
      - uses: actions/checkout@v4

      # checkout limpia el workspace con 'git clean -ffdx', que borra el .env
      # generado en el job de deploy porque no esta trackeado. Sin el, las
      # variables de imagen quedan vacias y 'docker compose exec' apunta a
      # servicios equivocados. Se regenera aqui.
      - name: Regenerar .env
        run: |
          cp .env.example .env
          echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> .env

      - name: Validar tunel uesimtun0 y conectividad
        run: bash ci/smoke-ue.sh

      - name: Recolectar diagnostico si algo fallo
        if: failure()
        run: bash ci/collect-logs.sh

      - name: Publicar diagnostico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-${{ github.run_number }}
          path: /tmp/lab5g-diag/
          retention-days: 7

  # ------------------------------------------------------------------
  #  4. Rollback si el smoke test fallo
  # ------------------------------------------------------------------
  rollback:
    needs: [ deploy, smoke ]
    if: failure()
    runs-on: [ self-hosted, lxc, free5gc ]
    steps:
      # Se detiene la RAN y las sondas, dejando el nucleo en pie para poder
      # inspeccionarlo. 'probes' se nombra explicitamente porque no esta en
      # COMPOSE_PROFILES y de otro modo compose no lo veria.
      - name: Detener RAN y sondas para no dejar el lab inconsistente
        run: |
          docker compose --profile ran --profile probes stop \
            gnb ue dn-iperf blackbox iperf-probe || true
      - name: Resumen
        run: |
          echo "::error::Smoke test fallido. El nucleo sigue en pie para" \
               "inspeccion; RAN detenida. Revisa el artefacto de diagnostico."
