info:
  version: 1.0.2
  description: NSSF initial local configuration - lab5g

configuration:
  nssfName: NSSF
  # Sin esto, el NSSF se registra en el NRF sin anunciar nnssf-nsselection,
  # y el AMF (SearchNssfNSSelectionInstance) nunca encuentra el servicio,
  # fallando siempre con "AMF can not select an NSSF by NRF" aunque el
  # NSSF este bien registrado.
  serviceNameList:
    - nnssf-nsselection
    - nnssf-nssaiavailability
  sbi:
    scheme: http
    registerIPv4: nssf
    bindingIPv4: 0.0.0.0
    port: 8000
  nrfUri: http://nrf:8000
  supportedPlmnList:
    - mcc: '732'
      mnc: '101'
  supportedNssaiInPlmnList:
    - plmnId:
        mcc: '732'
        mnc: '101'
      supportedSnssaiList:
        - sst: 1
          sd: '010203'
  amfSetList:
    - amfSetId: '1'
      nrfAmfSet: http://nrf:8000/nnrf-nfm/v1/nf-instances
      supportedNssaiAvailabilityData:
        - tai:
            plmnId:
              mcc: '732'
              mnc: '101'
            tac: '000001'
          supportedSnssaiList:
            - sst: 1
              sd: '010203'
  taList:
    - tai:
        plmnId:
          mcc: '732'
          mnc: '101'
        tac: '000001'
      accessType: 3GPP_ACCESS
      supportedSnssaiList:
        - sst: 1
          sd: '010203'

logger:
  enable: true
  level: info
  reportCaller: false