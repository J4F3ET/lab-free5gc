info:
  version: 1.0.3
  description: NRF initial local configuration - lab5g

configuration:
  # MongoDBName/MongoDBUrl van al nivel de 'configuration', no anidados bajo
  # 'mongodb:'. Con el nombre anidado el validador los ve vacios y el NRF
  # aborta con "Invalid MongoDBName/MongoDBUrl: non zero value required".
  MongoDBName: free5gc
  MongoDBUrl: mongodb://mongodb:27017
  sbi:
    scheme: http
    # El NRF vive en 10.100.200.10 (sbi_net) segun docker-compose.yaml.
    # Antes decia 10.100.0.11: subred inexistente -> ningun NF lograba registrarse.
    registerIPv4: nrf
    bindingIPv4: 0.0.0.0
    port: 8000
  serviceNameList:
    - nnrf-nfm
    - nnrf-disc
  DefaultPlmnId:
    mcc: '732'                 # antes '001' -> no casaba con AMF/NSSF/gNB/UE
    mnc: '101'                 # antes '01'

logger:
  enable: true
  level: info
  reportCaller: false
