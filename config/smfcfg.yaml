configuration:
  smfName: SMF
  sbi:
    scheme: http
    registerIPv4: smf
    bindingIPv4: 0.0.0.0
    port: 8000
  nrfUri: http://nrf:8000

  serviceNameList:
    - nsmf-pdusession
    - nsmf-event-exposure
    - nsmf-oam

  snssaiInfos:
    - sNssai:
        sst: 1
        sd: '010203'
      dnnInfos:
        - dnn: internet
          dns:
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888

  plmnList:
    - mcc: '732'
      mnc: '101'

  pfcp:
    listenAddr: 10.100.200.12
    externalAddr: 10.100.200.12
    nodeID: 10.100.200.12

  userplaneInformation:
    upNodes:
      gNB1:
        type: AN
      UPF:
        type: UPF
        nodeID: 10.100.200.20        # DEBE ser idéntico a upfcfg.pfcp.nodeID
        addr:   10.100.200.20
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: '010203'
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.60.0.0/16
        interfaces:
          - interfaceType: N3
            endpoints:
              - 10.100.201.20        # IP del UPF en n3_net, NO la de sbi_net
            networkInstances:
              - internet
    links:
      - A: gNB1
        B: UPF