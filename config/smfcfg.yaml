info:
  version: 1.0.3
  description: SMF initial local configuration

configuration:
  smfName: SMF
  sbi:
    scheme: http
    registerIPv4: 10.100.0.13
    bindingIPv4: 0.0.0.0
    port: 8000

  pfcp:
    addr: 10.100.0.13          # IP del propio SMF (interfaz PFCP hacia el UPF)

  nrfUri: http://10.100.0.11:8000   # IP del NRF

  userplaneInformation:
    upNodes:
      gNB1:
        type: AN
      UPF:
        type: UPF
        nodeID: 10.100.0.14       # IP del UPF
        addr: 10.100.0.14
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: '010203'
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.60.0.0/16    # rango de IPs asignadas a las UEs
    links:
      - A: gNB1
        B: UPF

  snssaiInfos:
    - sNssai:
        sst: 1
        sd: '010203'
      dnnInfos:
        - dnn: internet
          dns:
            ipv4: 8.8.8.8

logger:
  SMF:
    debugLevel: info
    ReportCaller: false
