info:
  version: 1.0.9
  description: AMF initial local configuration - lab5g

configuration:
  amfName: AMF
  ngapIpList:
    - 10.100.200.11          # <- IP de N2 en sbi_net, no 0.0.0.0
  ngapPort: 38412
  sbi:
    scheme: http
    registerIPv4: amf        # nombre DNS resoluble por Docker
    bindingIPv4: 0.0.0.0
    port: 8000
  nrfUri: http://nrf:8000

  # Requerido por el validador ("Invalid ServiceNameList"). namf-callback
  # NO es un valor aceptado en v3.4.4 (el validador solo admite estos 5).
  serviceNameList:
    - namf-comm
    - namf-evts
    - namf-mt
    - namf-loc
    - namf-oam

  servedGuamiList:
    - plmnId:
        mcc: '732'
        mnc: '101'
      amfId: cafe00          # 6 dígitos hex: RegionId(2)+SetId(3)+Pointer(1)

  supportTaiList:
    - plmnId:
        mcc: '732'
        mnc: '101'
      tac: '000001'          # == tac: 1 en gnb.yaml

  plmnSupportList:
    - plmnId:
        mcc: '732'
        mnc: '101'
      snssaiList:
        - sst: 1
          sd: '010203'

  supportDnnList:
    - internet

  security:
    integrityOrder:  [ NIA2 ]
    cipheringOrder:  [ NEA0 ]   # NEA0 = sin cifrado, facilita el análisis con tcpdump

  networkName:
    full: lab5g-co
    short: lab5g

  # Requeridos por el validador (T3502Value, T3512Value, T35xx): sin ellos
  # el AMF abortaba con "Config validate Error" antes de arrancar.
  t3502Value: 720
  t3512Value: 3600
  non3gppDeregTimerValue: 3240
  t3513:
    enable: true
    expireTime: 6s
    maxRetryTimes: 4
  t3522:
    enable: true
    expireTime: 6s
    maxRetryTimes: 4
  t3550:
    enable: true
    expireTime: 6s
    maxRetryTimes: 4
  t3555:
    enable: true
    expireTime: 6s
    maxRetryTimes: 4
  t3560:
    enable: true
    expireTime: 6s
    maxRetryTimes: 4
  t3565:
    enable: true
    expireTime: 6s
    maxRetryTimes: 4
  t3570:
    enable: true
    expireTime: 6s
    maxRetryTimes: 4

logger:
  enable: true
  level: info
  reportCaller: false